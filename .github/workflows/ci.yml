# ---------------------------------------------------------------------------
# Continuous integration.
#
# The pipeline proves four things, in increasing cost:
#   1. formatting and strict type checking pass;
#   2. the domain kernel's invariants hold (money, permissions, sharding);
#   3. the database schema enforces the security model (against real Postgres);
#   4. the authentication flows work end to end over HTTP.
#
# Steps 3 and 4 need a database, which the service container below provides.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22.15.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type check (strict, no `any`)
        run: pnpm -r typecheck

      - name: Provision database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          APP_PASSWORD: ci_password
        run: pnpm --filter @socialhub/db run setup

      - name: Unit and integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/socialhub
          REDIS_URL: redis://localhost:6379
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
